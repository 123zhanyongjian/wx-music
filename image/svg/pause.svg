<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 红色圆形背景（网易云标志性红色） -->
  <circle cx="50" cy="50" r="45" fill="#c62f2f"/>
  <!-- 左侧白色竖条 -->
  <rect x="35" y="30" width="14" height="40" rx="2" fill="#ffffff"/>
  <!-- 右侧白色竖条（间距加宽至12单位，比默认更宽松） -->
  <rect x="51" y="30" width="14" height="40" rx="2" fill="#ffffff"/>
</svg>